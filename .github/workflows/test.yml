name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set Up Clojure
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: 1.12.217

      - name: Prepare Babashka Deps
        run: bb prepare

      - name: Run Tests
        run: ./bin/ttt-test

      - name: Verify llm.txt is current
        run: |
          ./bin/ttt --llm > /tmp/llm.txt
          diff -u llm.txt /tmp/llm.txt
